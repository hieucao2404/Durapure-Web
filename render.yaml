services:
  - type: web
    name: durapure
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: durapure-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: AUTO_INIT_DATABASE
        value: "true"
      - key: STATIC_ROOT
        value: /app/public

databases:
  - name: durapure-db
    plan: free
    region: singapore
    databaseName: durapure
    user: durapure
    postgresMajorVersion: "18"
    ipAllowList: []