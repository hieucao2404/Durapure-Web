<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Sầu Riêng – Durapure</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        durian: {
                            DEFAULT: '#1D3524',
                            light: '#294C2F',
                            lighter: '#547044',
                            accent: '#FFF5C7',
                            gold: '#F2C94C',
                            dark: '#1D3524',
                        },
                        forest: {
                            DEFAULT: '#78952F',
                            hover: '#5E7624',
                            light: '#91AF42',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1D3524;
            color: #FFF5C7;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-durian-dark">

    <!-- Header / Navbar Container -->
    <header id="navbar-container" class="bg-durian-dark/95 border-b border-durian-lighter sticky top-0 z-40 backdrop-blur-sm">
        <!-- Will be loaded dynamically from app.js -->
    </header>

    <!-- Page Title Header -->
    <section class="relative py-16 bg-durian bg-cover bg-center border-b border-durian-lighter" style="background-image: url('images/durian/hero-mien-tay.png');">
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
            <h1 class="text-3xl sm:text-4xl font-bold text-white">Cửa Hàng Sầu Riêng Hữu Cơ</h1>
            <p class="text-sm text-durian-accent max-w-md mx-auto">Chọn lọc hương vị tinh tuý nhất từ Cai Lậy, Cái Bè và Chợ Lách (Quy cách 1kg)</p>
        </div>
    </section>

    <!-- Shop Content Section -->
    <main class="flex-grow py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
            <!-- Filter Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-durian-light border border-durian-lighter p-4 rounded-lg">
                <span class="text-xs font-semibold text-durian-gold uppercase tracking-wider">Trái Sầu Riêng Đặc Sản</span>

                <div class="flex items-center space-x-3">
                    <label for="roast-filter" class="text-xs text-durian-accent font-medium">Quy cách nhận hàng:</label>
                    <select id="roast-filter" onchange="filterProductsByRoast()" class="bg-durian border border-durian-lighter text-xs text-durian-accent rounded px-3 py-1.5 focus:outline-none focus:border-durian-gold">
                        <option value="All">Tất cả sản phẩm</option>
                        <option value="Nguyên trái">Nguyên trái</option>
                        <option value="Tách múi">Tách múi</option>
                        <option value="Cấp đông">Cấp đông</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- Products will be dynamically populated from app.js via WebView2 -->
                <div class="col-span-full flex flex-col justify-center items-center h-64 space-y-3">
                    <svg class="animate-spin h-8 w-8 text-durian-gold" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-durian-accent">Đang tải danh sách sản phẩm từ cơ sở dữ liệu...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <footer id="footer-container" class="bg-durian-dark border-t border-durian-lighter text-durian-accent">
        <!-- Will be loaded dynamically from app.js -->
    </footer>

    <!-- Shopping Cart Slide-out Drawer Container -->
    <div id="cart-drawer-container"></div>

    <!-- Product Detail Modal Container -->
    <div id="product-detail-modal-container" class="hidden"></div>

    <!-- Core App JS -->
    <script src="js/app.js"></script>

    <!-- Client-side filtering script -->
    <script>
        function filterProductsByRoast() {
            const filterVal = document.getElementById('roast-filter').value;
            const grid = document.getElementById('products-grid');
            if (!grid || products.length === 0) return;

            let filtered = products;
            if (filterVal !== "All") {
                filtered = products.filter(p => p.RoastOptions && p.RoastOptions.toLowerCase().includes(filterVal.toLowerCase()));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-12 text-durian-accent">Không tìm thấy sản phẩm nào có quy cách này.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(prod => {
                const roastOpts = prod.RoastOptions ? prod.RoastOptions.split(',') : ['Nguyên trái'];
                const optionsHtml = roastOpts.map(opt => `<option value="${opt.trim()}">Quy cách: ${formatProductOption(opt)}</option>`).join('');

                return `
                    <div class="bg-durian-light border border-durian-lighter rounded-lg overflow-hidden group shadow-lg flex flex-col justify-between hover:border-durian-gold transition-all duration-300">
                        <div class="relative overflow-hidden aspect-square bg-durian cursor-pointer" onclick="openProductDetail(${prod.Id})">
                            <img src="${prod.ImageUrl || 'images/blend.jpg'}" alt="${prod.Name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <span class="absolute top-2 right-2 bg-durian-dark text-durian-gold text-xs px-2.5 py-1 rounded-full border border-durian-lighter font-sans">
                                ${prod.Unit}
                            </span>
                        </div>
                        <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                            <div>
                                <h3 class="font-serif text-lg font-bold text-white group-hover:text-durian-gold transition-colors cursor-pointer" onclick="openProductDetail(${prod.Id})">${prod.Name}</h3>
                            </div>

                            <div class="space-y-4 pt-2">
                                <div class="flex justify-between items-center border-b border-durian-lighter pb-2">
                                    <span class="text-xl font-bold text-durian-gold">${formatMoney(prod.Price)}</span>
                                    <span class="text-xs text-durian-accent font-semibold">${prod.Unit}</span>
                                </div>

                                <div class="space-y-1">
                                    <label class="text-[10px] uppercase tracking-wider text-durian-accent/60 block font-sans">Quy cách nhận hàng</label>
                                    <select id="roast-${prod.Id}" class="w-full bg-durian border border-durian-lighter text-sm text-white rounded px-3 py-2 focus:outline-none focus:border-durian-gold cursor-pointer transition-colors duration-200">
                                        ${optionsHtml}
                                    </select>
                                </div>

                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <button onclick="quickAddToCart(${prod.Id}, '${prod.Name}', ${prod.Price}, '${prod.ImageUrl}')" class="border border-durian-gold text-durian-gold hover:bg-durian-gold hover:text-durian-dark text-xs font-bold py-2.5 rounded transition-all duration-300">
                                        THÊM GIỎ HÀNG
                                    </button>
                                    <button onclick="quickBuyNow(${prod.Id}, '${prod.Name}', ${prod.Price}, '${prod.ImageUrl}')" class="bg-forest hover:bg-forest-hover text-white text-xs font-bold py-2.5 rounded transition-all duration-300">
                                        MUA NGAY
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
